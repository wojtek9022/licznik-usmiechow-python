[Settings]
FACE_SCALE_FACTOR = 1.1        ; Scale factor for face detection
FACE_MIN_NEIGHBOURS = 4        ; Minimum neighbors for face detection
SMILE_SCALE_FACTOR = 1.8       ; Scale factor for smile detection
SMILE_MIN_NEIGHBOURS = 15      ; Minimum neighbors for smile detection
TIME_TO_START_COUNTING = 0.5   ; Time delay before counting
COUNTED_SMILE_COOLDOWN_TIME = 3.0  ; Time in seconds before counting next smile
CAMERA_SOURCE = 0  ; Default camera index
LANGUAGE = pl                 ; Language for the application (pl/en)
DEBUG_MODE = False           ; Debug mode for the application

[Font]
font = HERSHEY_SIMPLEX
scale = 1
color = (255, 0, 0)
thickness = 3
line_type = 2