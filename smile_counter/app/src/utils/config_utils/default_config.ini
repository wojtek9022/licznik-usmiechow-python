[Settings]
FACE_SCALE_FACTOR = 1.1        ; Scale factor for face detection
FACE_MIN_NEIGHBOURS = 15        ; Minimum neighbors for face detection
SMILE_SCALE_FACTOR = 1.2       ; Scale factor for smile detection
SMILE_MIN_NEIGHBOURS = 15      ; Minimum neighbors for smile detection
TIME_TO_START_COUNTING = 0.6   ; Time delay before counting
COUNTED_SMILE_COOLDOWN_TIME = 2.5  ; Time in seconds before counting next smile
CAMERA_SOURCE = 0  ; Default camera index
LANGUAGE = pl                 ; Language for the application (pl/en)
DEBUG_MODE = False           ; Debug mode for the application
APPLY_FACE_EFFECTS = False   ; Enable face effects (beards, mustaches etc.)
AUTO_CONFIG_ADJUSTING = False   ; Enable automatic adjustment of detection parameters

[Font]
font = HERSHEY_SIMPLEX
scale = 1
color = (255, 0, 0)
thickness = 3
line_type = 2